# PETFILE — Grupo ARCA
[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # La clave web de Firebase es pública por diseño (la seguridad está en las reglas de Firestore).
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyD3pbEsREXAQPUZ1ogYQY66OTeeZVvjc5c,BGIa1D38q4A-mle4ubKlSc9A1d2RhETRFZyfrmA9mvRADgdIZnHb1PG3i8Q6o-4MfviRKPF0IrHwApiD40SYlwk"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "web-push"]

# Notificaciones: revisa cada hora qué avisar (resumen a las 7:00 de cada persona y citas 1 hora antes).
[functions."send-reminders"]
  schedule = "0 * * * *"

# Fotos para el PDF: solo el bucket de PETFILE y solo imágenes (la función valida ruta, tipo y contenido).
# Cualquier otra dirección bajo /fs/ no existe.
[[redirects]]
  from = "/fs/v0/b/petfile-15279.firebasestorage.app/o/*"
  to = "/.netlify/functions/fs-photo/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://www.gstatic.com/firebasejs/10.12.2/; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; style-src-elem 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasestorage.googleapis.com https://formsubmit.co; manifest-src 'self'; worker-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Aviso de versión nueva: version.json nunca se guarda en caché.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
