.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:520px;margin:0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.logo .mark{width:34px;height:34px}
.logo .word{width:96px;height:19px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--ok)}

main{max-width:520px;margin:0 auto;padding-block:18px calc(var(--navh) + 32px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h2{font-size:20px}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:14px}
.muted{color:var(--muted)}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{background:var(--warn);color:#fff}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}

.hello h1{font-size:28px;line-height:1.1}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left}

.stat.alert b{color:var(--warn)}
.pets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{position:relative;border:0;padding:0;border-radius:22px;overflow:hidden;aspect-ratio:4/5;max-width:100%;background:var(--accent-soft);box-shadow:var(--shadow);text-align:left;color:#fff;transition:transform .15s}

.pcard .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.72));display:flex;flex-direction:column;gap:1px}
.pcard .n{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1;overflow-wrap:anywhere}
.pcard .m{font-size:12px;opacity:.88}
.pcard .badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--warn);color:#fff}
.pcard .badge.calm{background:rgba(255,255,255,.92);color:#111}
.pcard.add{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700}
.pcard.add b{font-size:36px;line-height:1;color:var(--accent);font-family:var(--f-display)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.rem{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.rem:first-child{border-top:0}
.av{width:42px;height:42px;border-radius:13px;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--accent)}
.rem .t{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.rem .s{font-size:13px;color:var(--muted)}
.rem .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--accent-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.late,.chip.soon{background:var(--warn-soft);color:var(--warn)}
.mini{display:flex;gap:10px}
.mini button{background:none;border:0;padding:2px 0;font-size:12.5px;font-weight:700;color:var(--muted)}
.mini button:hover{color:var(--ink)}
.group-t{font-size:13px;font-weight:700;color:var(--muted);margin:4px 2px -4px}

.empty{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.empty .mark{width:110px;height:110px}
.empty p{margin:0;max-width:34ch;color:var(--muted)}
.empty .row{display:flex;flex-direction:column;gap:8px;width:100%;max-width:280px}

/* ficha */
.hero{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:1/1;max-height:420px;width:100%;max-width:100%;background:var(--accent-soft);box-shadow:var(--shadow)}
.hero img,.hero .ini{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ini{display:grid;place-items:center;font-family:var(--f-display);font-size:120px;font-weight:700;color:var(--accent)}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 18px 18px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
.hero .cap h1{font-size:34px;line-height:1.05;overflow-wrap:anywhere}
.hero .cap .sub{font-size:14px;opacity:.9;margin-top:2px}
.round{position:absolute;top:12px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.round svg{width:20px;height:20px}
.round.l{left:12px}.round.r{right:12px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:2px}
.fact .v{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.25}
@media (max-width:400px){.facts{grid-template-columns:repeat(2,1fr)}}
.reader{border-radius:20px;padding:16px;background:var(--ink);color:var(--bg);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.reader b{font-family:var(--f-display);font-size:18px;display:block}
.reader p{margin:2px 0 0;font-size:13px;opacity:.75}
.reader .btn{background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;white-space:nowrap;flex:none}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.timeline{display:flex;flex-direction:column;gap:10px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:38px 1fr;gap:12px}
.ticon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc)}
.ticon svg{width:20px;height:20px}
.entry .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.entry .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.entry .ty{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tc)}
.entry .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.entry .tt{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.entry .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.entry .notes{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.entry .acts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:6px}
.entry .acts button.t{background:none;border:0;padding:0;font-size:13px;font-weight:700;color:var(--muted)}
.entry .acts button.red{color:var(--warn)}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:520px;margin:0 auto;height:var(--navh);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nb{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 0;position:relative}
.nb svg{width:24px;height:24px}

.nav .in{grid-template-columns:1fr 1fr auto 1fr 1fr!important;gap:4px}
.right{display:flex;align-items:center;gap:10px}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{border:0;background:none;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:380px){.sync span.tx{display:none}.logo .word{width:80px}}
.help-intro{background:var(--ink);color:var(--bg);border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center}
.help-intro .mark{width:56px;height:56px;background:var(--bg);flex:none}
.help-intro p{margin:2px 0 0;font-size:14px;opacity:.8}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.acc summary{list-style:none;display:grid;grid-template-columns:38px 1fr 20px;gap:12px;align-items:center;padding:14px;cursor:pointer;font-weight:700;font-size:16px}
.acc summary::-webkit-details-marker{display:none}
.acc summary .chev{transition:transform .2s;color:var(--muted)}
.acc[open] summary .chev{transform:rotate(90deg)}
.acc summary small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.acc .ticon{--tc:var(--accent)}
.steps{margin:0;padding:0 16px 16px;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14.5px;line-height:1.45}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--ink);font-weight:700;font-size:13px;display:grid;place-items:center;font-family:var(--f-display)}
.tip{margin:0 16px 16px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:13.5px;color:var(--muted)}
.tip b{color:var(--ink)}
.kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:7px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;vertical-align:1px}
.helpcta{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:16px;padding:12px 14px;border:0;text-align:left;font-size:14px;width:100%}
.helpcta b{display:block;font-size:15px}
.shot{margin:0;display:flex;flex-direction:column;gap:8px;align-items:center}
.shot-in{width:100%;max-width:330px;border:8px solid var(--ink);border-radius:34px;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);pointer-events:none;user-select:none;text-align:left}
.shot-hero{position:relative;aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--accent-soft),var(--surface));display:grid;place-items:center}
.shot-hero .mark{width:46%;height:80%;background:var(--accent);opacity:.9}
.shot-hero .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;display:flex;flex-direction:column}
.shot-hero .cap b{font-family:var(--f-display);font-size:22px;line-height:1}
.shot-hero .cap span{font-size:11.5px;opacity:.9}
.shot figcaption{font-size:12.5px;color:var(--muted);text-align:center;max-width:32ch}
body.signed-out .nav{display:none}
body.signed-out main{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.acct{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:700;font-size:15px;display:grid;place-items:center;flex:none}
.auth{display:flex;flex-direction:column;gap:18px;padding-top:4px}
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:10px}
.auth-brand .mark{width:104px;height:104px}.auth-brand .word{width:150px;height:30px;-webkit-mask-position:center;mask-position:center}
.auth h1{font-size:26px;text-align:center}
.pw{position:relative}.pw input{padding-right:84px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--surface);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.arca{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.arca small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.arca img{width:170px;max-width:100%;border-radius:14px;display:block}
.trial{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border-radius:16px;padding:11px 14px;font-size:14px;flex-wrap:wrap}
.install{display:grid;grid-template-columns:38px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.install b{display:block;font-size:15px}.install span{font-size:13.5px;color:var(--muted)}
.install .ia{display:flex;gap:14px;align-items:center;margin-top:10px}
main.locked{filter:blur(8px);pointer-events:none;user-select:none}
.lock{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.lock .card{background:var(--surface);border-radius:26px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:var(--shadow)}
.lock .tag{align-self:center;background:var(--warn);color:#fff;font-weight:800;padding:4px 10px;border-radius:999px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.lock h2{font-size:24px}
.idbox{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere;user-select:all}
.famcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.famcard b{display:block;font-size:15px}.famcard span>span{font-size:13px;color:var(--muted)}
.favs{display:flex}.favs .fav+.fav{margin-left:-10px}
.fav{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--ink);border:2px solid var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;flex:none}
.mrow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.list>.mrow:first-child{border-top:0}
.mrow b{display:block;font-size:15px;overflow-wrap:anywhere}.mrow div>span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tagsm{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--ink);color:var(--bg);white-space:nowrap}
.invbox{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.codebig{font-family:var(--f-mono);font-size:30px;font-weight:500;letter-spacing:.22em;padding:8px 0;user-select:all;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;padding:2px;color:var(--line);line-height:0}
.stars button.on{color:#F5A524}
:root{--gold:#93600A;--gold-soft:#FFF1D2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#F5BC4E;--gold-soft:#3A2B0D}}
:root[data-theme="dark"]{--gold:#F5BC4E;--gold-soft:#3A2B0D}
.pbadge{display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:var(--gold-soft);color:var(--gold);margin-left:6px;vertical-align:2px;line-height:1.4}
.seg button.locked{color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-style:dashed}
.seg button.locked .pbadge{margin-left:0}
.lockfield{width:100%;text-align:left;border:1px dashed var(--line);background:var(--bg);border-radius:12px;padding:12px;min-height:46px;font-size:16px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;font-weight:500}
.prembox{background:var(--gold-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:14px;text-align:left;color:var(--ink)}
.prembox b{color:var(--gold);font-size:15px;font-family:var(--f-display)}
.prembox ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.codebig.blur{filter:blur(7px);user-select:none}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none}
.iconbtn[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
body.signed-out .iconbtn{display:none}
.types button.lockedt{border-style:dashed}
.pcard.add .pbadge{margin:4px 0 0}
.trial.free{background:var(--gold-soft)}
.keybox{border:1px dashed var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.keybox b{font-size:15px}
.keybox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 11px;font-family:var(--f-mono);font-size:14px;color:var(--ink)}
.rclock{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:14px}
.rclock b{display:block;font-size:15px;margin-bottom:2px}.rclock span>span,.rclock>span:last-child{font-size:13.5px;color:var(--muted)}
.rclock b{color:var(--ink)}
.rcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rcitem{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.rcitem img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--accent-soft)}
.rcitem span{padding:7px 8px;display:flex;flex-direction:column;min-width:0}
.rcitem b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rcitem small{font-size:11px;color:var(--muted)}
.rcadd{align-items:center;justify-content:center;gap:6px;border-style:dashed;min-height:120px;color:var(--accent)}

.rcpick{display:flex;gap:14px;align-items:center}

.ntcard{display:grid;grid-template-columns:38px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left}

.fab{width:58px;height:58px;border-radius:20px;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px rgba(0,0,0,.22)}

/* hojas */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .18s ease}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);align-self:center}
.sheet h2{font-size:22px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px;color:var(--ink);font-weight:500;min-width:0;min-height:46px}
.f textarea{min-height:84px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 8px;font-weight:700;font-size:14px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-pick .ph{width:84px;height:84px;border-radius:24px;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.photo-pick .ph .mark{width:52px;height:52px;background:var(--accent)}
.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot .r{display:flex;gap:8px;margin-left:auto}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types button{border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;font-weight:700;font-size:15px;min-height:96px}
.types button.wide{grid-column:1/-1;flex-direction:row;align-items:center;background:var(--ink);color:var(--bg);border-color:var(--ink);min-height:0}
.types button.wide .ticon{background:rgba(255,255,255,.14);color:var(--bg)}
.types small{display:block;font-weight:500;font-size:12.5px;opacity:.75}
.confirm{background:var(--warn-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rx-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px}
.rx-item input{margin-top:3px;width:20px;height:20px;accent-color:var(--accent);flex:none}
.err{color:var(--warn);font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;z-index:60;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function dayDiff(s){if(!s)return null;return Math.round((new Date(s.slice(0,10)+'T00:00')-new Date(todayStr()+'T00:00'))/864e5)}
function rel(n){if(n===0)return t('today');if(n===1)return t('tomorrow');if(n===-1)return t('yesterday');if(n>0)return n<60?t('inDays',n):t('inMonths',Math.round(n/30));return t('daysAgo',-n)}
function ageOf(b){if(!b)return'—';const s=new Date(b+'T00:00'),n=new Date();let m=(n.getFullYear()-s.getFullYear())*12+n.getMonth()-s.getMonth();if(n.getDate()<s.getDate())m--;if(m<0)return'—';if(m<1)return t('ageDays',Math.floor((n-s)/864e5));if(m<24)return t('ageMonths',m);return t('ageYears',Math.floor(m/12),m%12)}

S.es.help.splice(S.es.help.length-1,0,['paw','Compartir con tu familia','Varias cuentas, las mismas mascotas',['Abrí la pestaña <b>Familia</b>, en la barra de abajo.','Tocá <b>Compartir invitación</b> y mandale el enlace o el código a la otra persona.','Esa persona crea su cuenta con su correo y entra con el enlace, o en Mi familia toca <b>Unirme a otra familia</b> y escribe el código.','Desde ese momento todos ven y editan las mismas mascotas, y los cambios aparecen al instante en todos los teléfonos.','El administrador puede quitar personas o cambiar el código. Los demás pueden salir cuando quieran.'],`Invitar es parte de Premium. Solo el administrador paga la licencia, y cubre a toda la familia (hasta ${MAX_FAMILY} personas).`]);
S.en.help.splice(S.en.help.length-1,0,['paw','Share with your family','Several accounts, the same pets',['Open the <b>Family</b> tab in the bottom bar.','Tap <b>Share invite</b> and send the link or code to the other person.','They create an account with their email and open the link, or tap <b>Join another family</b> in My family and enter the code.','From then on everyone sees and edits the same pets, and changes show up instantly on every phone.','The admin can remove people or change the code. Everyone else can leave whenever they want.'],`Inviting is part of Premium. Only the admin pays for the license, and it covers the whole family (up to ${MAX_FAMILY} people).`]);
S.es.help[S.es.help.length-1]=['shield','Cuenta, idioma y licencia','Configuración',['Tu información se guarda en la nube: podés entrar desde cualquier teléfono con tu correo y contraseña.','El círculo con tu inicial, arriba a la derecha, abre <b>Mi cuenta</b>: ahí ves el plan de la familia, los días de prueba y el botón para cerrar sesión.','Al lado cambiás el idioma entre <b>ES</b> (español) y <b>EN</b> (inglés).'],'Los primeros 12 días tenés Premium gratis. Después seguís con la versión gratis, y con la licencia volvés a tener todo Premium. Si compraste, activá tu código en Mi cuenta.'];
S.en.help[S.en.help.length-1]=['shield','Account, language and license','Settings',['Your information is saved in the cloud: sign in from any phone with your email and password.','The circle with your initial, at the top right, opens <b>My account</b>: the family plan, trial days left and the sign-out button.','Next to it you switch the language between <b>ES</b> (Spanish) and <b>EN</b> (English).'],'Your first 12 days are Premium for free. After that you keep the free version, and a license brings back all of Premium. If you bought one, activate your code in My account.'];

(()=>{try{const c=new URLSearchParams(location.search).get('familia');if(c){sessionStorage.setItem(JOINKEY,c.trim().toUpperCase());history.replaceState(null,'',location.pathname+location.hash)}}catch(e){}})();

const clearJoin=()=>{try{sessionStorage.removeItem(JOINKEY)}catch(e){}};
function newCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=new Uint32Array(6);crypto.getRandomValues(r);return Array.from(r,x=>A[x%A.length]).join('')}
function myName(){return (fb.acct&&fb.acct.name)||(fb.user&&fb.user.displayName)||fb.pendingName||((fb.user&&fb.user.email)||'').split('@')[0]||'?'}
const isFamOwner=()=>!!(fb.fam&&fb.user&&fb.fam.owner===fb.user.uid);
const ownerName=()=>{const f=fb.fam;if(!f)return'';const i=(f.memberInfo||{})[f.owner]||{};return i.name||i.email||'—'};
const inviteLink=code=>location.origin+location.pathname+'?familia='+encodeURIComponent(code);

function license(){
  const f=fb.fam,now=Date.now();
  if(!f)return{status:'trial',days:TRIAL_DAYS,pending:true};
  const ts=f.trialStart&&f.trialStart.toDate?f.trialStart.toDate().getTime():now;
  const paid=f.paidUntil&&f.paidUntil.toDate?f.paidUntil.toDate().getTime():0;
  if(paid>now)return{status:'paid',until:paid};
  const end=ts+TRIAL_DAYS*864e5;
  if(now<end)return{status:'trial',days:Math.max(1,Math.ceil((end-now)/864e5)),end};
  return{status:'free',end};
}
const hasCheckout=()=>!/PEGAR/.test(CHECKOUT_URL);
function checkoutUrl(){try{const u=new URL(CHECKOUT_URL);if(fb.user){u.searchParams.set('checkout[email]',fb.user.email||'');u.searchParams.set('checkout[custom][user_id]',fb.user.uid);if(fb.famId)u.searchParams.set('checkout[custom][family_id]',fb.famId)}return u.toString()}catch(e){return CHECKOUT_URL}}
const canBuy=()=>hasCheckout()&&isFamOwner();
const buyBtn=cls=>canBuy()?`<a class="btn ${cls||''}" href="${esc(checkoutUrl())}" target="_blank" rel="noopener">${t('lic_buy')}</a>`:'';
function trialBanner(){
  const L=license();if(L.pending||L.status==='paid')return'';
  const buy=canBuy()?`<a class="lnk" href="${esc(checkoutUrl())}" target="_blank" rel="noopener">${t('lic_buy')}</a>`:`<button class="lnk" data-act="premium">${t('prem_see')}</button>`;
  return L.status==='trial'?`<div class="trial"><span><b>${t('lic_trial',L.days)}</b><br><span class="muted" style="font-size:13px">${t('lic_trialB')}</span></span>${buy}</div>`
    :`<div class="trial free"><span><b>${t('lic_freeB')}</b></span>${buy}</div>`;
}
function planText(){const L=license();return L.status==='paid'?(new Date(L.until).getFullYear()>=2099?t('lic_paidOn'):t('lic_paid',fmtDate(ymd(new Date(L.until))))):L.status==='trial'?t('lic_trial',L.days):t('lic_free')}
function famMembers(){const f=fb.fam;if(!f)return[];return (f.members||[]).map(id=>Object.assign({id},(f.memberInfo||{})[id]||{})).sort((a,b)=>(a.id===f.owner?-1:b.id===f.owner?1:0))}
function famCard(){
  if(!fb.fam)return'';const m=famMembers();
  const av=m.slice(0,4).map(x=>`<span class="fav">${esc((x.name||x.email||'?').charAt(0).toUpperCase())}</span>`).join('');
  return `<button class="famcard" data-act="family"><span class="favs">${av}</span><span style="min-width:0"><b>${t('fam_t')}</b><span>${m.length>1?t('fam_cardMany',m.length):t('fam_cardSolo')}</span></span><span class="lnk">${m.length>1?'':t('fam_invite')}</span></button>`;
}

/* almacenamiento con Firebase */
function persist(pet){
  state.pets[pet.id]=pet;render();
  if(!fb.petsCol)return;
  fb.petsCol.doc(pet.id).set(JSON.parse(JSON.stringify(pet))).catch(e=>{console.warn(e);toast(e&&e.code==='permission-denied'?t('lic_noWrite'):t('t_cloudErr'))});
}
function removePet(id){delete state.pets[id];if(fb.petsCol)fb.petsCol.doc(id).delete().catch(e=>{console.warn(e);toast(t('t_cloudErr'))})}
function stopFamily(){fb.famUnsubs.forEach(u=>{try{u()}catch(e){}});fb.famUnsubs=[];fb.fam=null;fb.famId=null;fb.petsCol=null;state.pets={}}
function stopAll(){stopFamily();if(fb.userUnsub){try{fb.userUnsub()}catch(e){}fb.userUnsub=null}}

// Crea la familia propia (mismo ID que la cuenta). La prueba usa la fecha de creación de la cuenta.
async function ensureOwnFamily(migrate){
  const uid=fb.user.uid,ref=famRef(uid);
  let snap=null;try{snap=await ref.get()}catch(e){console.warn(e)}
  if(!snap||!snap.exists){
    const code=newCode(),name=myName();const b=fdb.batch();
    b.set(ref,{owner:uid,members:[uid],memberInfo:{[uid]:{name,email:fb.user.email||''}},code,name,trialStart:fb.acctRaw.trialStart});
    b.set(fdb.collection('invites').doc(code),{familyId:uid,ownerName:name});
    await b.commit();
  }
  if(migrate){ // pasar mascotas de la versión anterior (users/{uid}/pets)
    try{const old=await userRef().collection('pets').get();for(const d of old.docs){await ref.collection('pets').doc(d.id).set(d.data())}}catch(e){console.warn('migración',e)}
  }
}
async function backToOwn(notify){
  if(fb.switching||!fb.user)return;fb.switching=true;
  try{await ensureOwnFamily(false);await userRef().update({familyId:fb.user.uid});if(notify)toast(t('fam_removed'))}catch(e){console.warn(e)}
  fb.switching=false;
}
function listenFamily(fid){
  stopFamily();fb.famId=fid;state.loading=true;render();
  const uid=fb.user.uid;
  fb.famUnsubs.push(famRef(fid).onSnapshot(s=>{
    if(!s.exists){if(fid===uid)ensureOwnFamily(false).catch(e=>console.warn(e));else backToOwn(true);return}
    const d=s.data({serverTimestamps:'estimate'});
    if(!(d.members||[]).includes(uid)){if(fid!==uid)backToOwn(true);return}
    fb.fam=d;render();maybeJoinPending();
  },e=>{console.warn(e);if(fid!==uid)backToOwn(true)}));
  fb.petsCol=famRef(fid).collection('pets');
  fb.famUnsubs.push(fb.petsCol.onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{m[d.id]=Object.assign({},d.data(),{id:d.id})});
    state.pets=m;state.loading=false;render();
  },e=>{console.warn(e);state.loading=false;render()}));
}
function connect(){
  state.caps.downloads={save:async({filename,data})=>{const u=URL.createObjectURL(data);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}};
  if(!fb.ok||!window.firebase){fb.ready=true;render();return}
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fdb=firebase.firestore();
  try{fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  auth.onAuthStateChanged(u=>{
    stopAll();fb.user=u;fb.acct=null;fb.acctRaw=null;
    if(!u){fb.ready=true;state.loading=false;render();return}
    state.loading=true;fb.ready=true;render();
    const uref=fdb.collection('users').doc(u.uid);
    fb.userUnsub=uref.onSnapshot(snap=>{
      if(!snap.exists){ // cuenta nueva: usuario + familia propia + código, todo junto
        if(fb.creating)return;fb.creating=true;
        const name=fb.pendingName||u.displayName||(u.email||'').split('@')[0],code=newCode(),ts=FV().serverTimestamp();
        const b=fdb.batch();
        b.set(uref,{email:u.email||'',name,lang,trialStart:ts,familyId:u.uid});
        b.set(famRef(u.uid),{owner:u.uid,members:[u.uid],memberInfo:{[u.uid]:{name,email:u.email||''}},code,name,trialStart:ts});
        b.set(fdb.collection('invites').doc(code),{familyId:u.uid,ownerName:name});
        b.commit().catch(e=>{console.warn(e);toast(t('e_gen'))}).finally(()=>{fb.creating=false});
        return;
      }
      fb.acct=snap.data({serverTimestamps:'estimate'});fb.acctRaw=snap.data();
      const fid=fb.acct.familyId;
      if(!fid){ // cuenta de la versión anterior: crear su familia y pasar sus mascotas
        if(fb.creating||snap.metadata.hasPendingWrites)return;fb.creating=true;
        ensureOwnFamily(true).then(()=>uref.update({familyId:u.uid})).catch(e=>{console.warn(e);toast(t('e_gen'))}).finally(()=>{fb.creating=false});
        return;
      }
      if(fid!==fb.famId)listenFamily(fid);else render();
    },e=>{console.warn(e);state.loading=false;render()});
  });
}

/* familia */
async function lookupCode(code){
  const s=await fdb.collection('invites').doc(code).get();
  if(!s.exists)throw{code:'nocode'};return s.data();
}
async function joinFamily(code,inv){
  const uid=fb.user.uid,oldFid=fb.famId,oldIsOwn=oldFid===uid,mine=Object.values(state.pets);
  await famRef(inv.familyId).update({members:FV().arrayUnion(uid),['memberInfo.'+uid]:{name:myName(),email:fb.user.email||''},joinCode:code});
  if(oldIsOwn&&mine.length&&(fb.fam&&(fb.fam.members||[]).length===1)){
    const dest=famRef(inv.familyId).collection('pets');
    for(const p of mine){try{await dest.doc(p.id).set(JSON.parse(JSON.stringify(p)));await famRef(oldFid).collection('pets').doc(p.id).delete().catch(()=>{})}catch(e){console.warn(e)}}
  }
  if(!oldIsOwn){await famRef(oldFid).update({members:FV().arrayRemove(uid),['memberInfo.'+uid]:FV().delete()}).catch(e=>console.warn(e))}
  await userRef().update({familyId:inv.familyId});
}
async function leaveFamily(){
  const uid=fb.user.uid,fid=fb.famId;
  await famRef(fid).update({members:FV().arrayRemove(uid),['memberInfo.'+uid]:FV().delete()});
  await backToOwn(false);
}
async function removeMember(id){await famRef(fb.famId).update({members:FV().arrayRemove(id),['memberInfo.'+id]:FV().delete()})}
async function changeCode(){
  const old=fb.fam.code,code=newCode(),b=fdb.batch();
  b.update(famRef(fb.famId),{code});
  b.set(fdb.collection('invites').doc(code),{familyId:fb.famId,ownerName:myName()});
  if(old)b.delete(fdb.collection('invites').doc(old));
  await b.commit();
}
function maybeJoinPending(){const c=pendingJoin();if(!c||!fb.fam)return;clearJoin();joinSheet(c)}

function familyBody(){
  const f=fb.fam;if(!f)return`<p class="muted" style="text-align:center"><span class="spinner"></span> ${t('loading')}</p>`;

async function activateKey(ev){
  ev.preventDefault();const key=$('#lic-key').value.trim(),msg=$('#lic-msg'),go=$('#lic-go');msg.hidden=true;
  if(key.length<8){msg.textContent=t('ac_keyBad');msg.hidden=false;return}
  go.disabled=true;go.innerHTML='<span class="spinner"></span>';
  try{
    const tok=await fb.user.getIdToken();
    const r=await fetch('/.netlify/functions/activate',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({key})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw{code:j.error||'fail'};
    closeSheet();toast(t('ac_keyOk'));
  }catch(e){console.warn(e);const c=e&&e.code;msg.textContent=c==='invalid'?t('ac_keyBad'):c==='used'?t('ac_keyUsed'):c==='expired'?t('ac_keyExp'):t('ac_keyFail');msg.hidden=false;go.disabled=false;go.textContent=t('ac_keyBtn')}
}
document.addEventListener('submit',ev=>{if(ev.target&&ev.target.id==='keyform')activateKey(ev)});
function joinSheet(prefill){
  openSheet(`<div><h2>${t('fam_joinT')}</h2><p class="muted" style="margin:4px 0 0">${t('fam_joinD')}</p></div>
  <form id="joinform" class="fields" novalidate><label class="f full">${t('fam_code')}<input id="jn-code" autocapitalize="characters" autocomplete="off" maxlength="6" placeholder="${t('fam_codePh')}" value="${esc(prefill||'')}" style="font-family:var(--f-mono);letter-spacing:.2em;text-transform:uppercase"></label>
  <div id="jn-msg" class="full err" role="alert" hidden></div><button class="btn dark block full" type="submit" id="jn-go">${t('fam_find')}</button></form><div id="jn-res"></div>`);
  const go=async ev=>{ev&&ev.preventDefault();const c=$('#jn-code').value.trim().toUpperCase(),msg=$('#jn-msg');msg.hidden=true;$('#jn-res').innerHTML='';
    if(c.length<6){msg.textContent=t('fam_e_code');msg.hidden=false;return}

      $('#jn-confirm').onclick=async()=>{const b=$('#jn-confirm');b.disabled=true;b.innerHTML='<span class="spinner"></span>';
        try{await joinFamily(c,inv);closeSheet();toast(t('fam_joined',inv.ownerName||''));go_home()}catch(e){console.warn(e);b.disabled=false;b.textContent=t('fam_joinBtn');msg.textContent=e&&e.code==='permission-denied'?t('fam_e_full'):t('e_gen');msg.hidden=false}};

function authErr(e){const c=(e&&e.code)||'';return c.includes('invalid-email')?t('e_email'):c.includes('email-already')?t('e_inuse'):c.includes('weak-password')?t('e_weak'):(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')||c.includes('invalid-login'))?t('e_cred'):c.includes('too-many')?t('e_many'):c.includes('network')?t('e_net'):t('e_gen')}
function bindAuth(){
  const f=$('#authform');if(!f)return;
  f.addEventListener('submit',async ev=>{ev.preventDefault();const up=fb.authMode==='up';const err=$('#au-err');err.hidden=true;
    const email=$('#au-email').value.trim(),pw=$('#au-pw').value,name=up?$('#au-name').value.trim():'';
    const show=m=>{err.textContent=m;err.hidden=false};
    if(!email||!pw||(up&&!name))return show(t('e_fill'));
    if(up&&pw!==$('#au-pw2').value)return show(t('e_match'));
    const go=$('#au-go');go.disabled=true;go.innerHTML='<span class="spinner"></span>';
    try{auth.languageCode=lang;
      if(up){fb.pendingName=name;const c=await auth.createUserWithEmailAndPassword(email,pw);try{await c.user.updateProfile({displayName:name})}catch(e){}}
      else await auth.signInWithEmailAndPassword(email,pw);
    }catch(e){console.warn(e);show(authErr(e));go.disabled=false;go.textContent=up?t('au_up'):t('au_in')}
  });
}

function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===lang));
  const app=$('#app'),acct=$('#acct'),lock=$('#lock');
  if(!fb.ok){document.body.classList.add('signed-out');app.innerHTML=`<div class="empty"><p>${t('cfg')}</p></div>${arcaBadge()}`;return}
  if(!fb.ready){app.innerHTML=`<p class="muted" style="text-align:center;padding-top:40px"><span class="spinner"></span> ${t('loading')}</p>`;return}
  if(!fb.user){document.body.classList.add('signed-out');acct.hidden=true;lock.innerHTML='';app.classList.remove('locked');
    const keep=$('#au-email')?{e:$('#au-email').value}:null;app.innerHTML=authView();if(keep)$('#au-email').value=keep.e;bindAuth();return}
  document.body.classList.remove('signed-out');acct.hidden=false;
  acct.textContent=myName().trim().charAt(0).toUpperCase();acct.setAttribute('aria-label',t('ac_t'));
  renderMain();

  const exp=!!fb.fam&&license().status==='expired';
  app.classList.toggle('locked',exp);app.setAttribute('aria-hidden',exp?'true':'false');
  if(exp){if(!lock.innerHTML||lock.dataset.l!==lang){lock.innerHTML=lockView();lock.dataset.l=lang}}else lock.innerHTML='';
}
const WRITE_ACTS=new Set(['fab','new-pet','edit-pet','new-entry','edit-entry','ask-del','del-entry','done','pick-rx']);
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(WRITE_ACTS.has(a)&&fb.user&&fb.fam&&license().status==='expired'){ev.stopImmediatePropagation();toast(t('lic_noWrite'));return}
  const stop=()=>ev.stopImmediatePropagation();
  if(fb.user&&fb.fam&&!isPremium()){
    if((a==='new-pet'||(a==='fab'&&state.view.name!=='pet'))&&petLimit()){stop();closeSheet();premiumSheet('prem_pets');return}
    if(a==='ics'||a==='ics-all'){stop();premiumSheet('prem_cal');return}
  }
  switch(a){
    case'account':stop();accountSheet();break;
    case'logout':stop();closeSheet();auth&&auth.signOut();try{history.replaceState(null,'',location.pathname)}catch(e){}state.view={name:'home'};break;
    case'auth-tab':stop();fb.authMode=el.dataset.v;render();break;
    case'forgot':stop();forgotSheet();break;
    case'toggle-pw':{stop();const i=$('#'+el.dataset.for);if(i){const s=i.type==='password';i.type=s?'text':'password';el.textContent=s?t('au_hide'):t('au_show')}break}
    case'copy-uid':stop();copyText(fb.famId||'',t('ac_copied'));break;
    case'refresh-lic':{stop();if(!fb.famId)break;el.disabled=true;el.innerHTML='<span class="spinner"></span>';
      famRef(fb.famId).get({source:'server'}).then(s=>{fb.fam=s.data({serverTimestamps:'estimate'});$('#lock').innerHTML='';render();toast(license().status==='expired'?t('lic_still'):t('lic_ok'))}).catch(()=>{toast(t('e_net'));$('#lock').innerHTML='';render()});break}
    case'family':stop();familySheet();break;
    case'familia':stop();closeSheet();go('familia');break;
    case'premium':{stop();const box=el.dataset.into&&$('#'+el.dataset.into);if(box){box.innerHTML=premiumBox(el.dataset.why);box.hidden=false;box.scrollIntoView({block:'nearest',behavior:'smooth'})}else premiumSheet(el.dataset.why);break}
    case'fam-share':stop();shareInvite();break;
    case'fam-copylink':stop();copyText(inviteLink(fb.fam.code),t('fam_copiedInv'));break;
    case'fam-newcode':stop();changeCode().then(()=>{toast(t('fam_newCodeOk'));setTimeout(familySheet,300)}).catch(e=>{console.warn(e);toast(t('e_gen'))});break;
    case'fam-join':stop();joinSheet('');break;
    case'fam-leave-ask':{stop();const box=$('#famfoot');if(box)box.innerHTML=`<div class="confirm"><span style="font-size:14px">${t('fam_leaveQ')}</span><div style="display:flex;gap:8px"><button class="btn sm danger" data-act="fam-leave">${t('fam_leave')}</button><button class="btn sm ghost" data-act="close">${t('cancel')}</button></div></div>`;break}
    case'fam-leave':stop();el.disabled=true;leaveFamily().then(()=>{closeSheet();$('#lock').innerHTML='';toast(t('fam_left'));go_home()}).catch(e=>{console.warn(e);toast(t('e_gen'))});break;
    case'fam-remove':{stop();const id=el.dataset.id,info=(fb.fam.memberInfo||{})[id]||{},n=info.name||info.email||'';const box=$('#mc-'+id);if(box)box.innerHTML=`<div class="confirm" style="margin:0 12px 12px"><span style="font-size:14px">${esc(t('fam_removeQ',n))}</span><div style="display:flex;gap:8px"><button class="btn sm danger" data-act="fam-remove-yes" data-id="${id}">${t('fam_remove')}</button><button class="btn sm ghost" data-act="family">${t('cancel')}</button></div></div>`;break}
    case'fam-remove-yes':{stop();const id=el.dataset.id,info=(fb.fam.memberInfo||{})[id]||{};removeMember(id).then(()=>{toast(t('fam_removedOk',info.name||info.email||''));setTimeout(familySheet,300)}).catch(e=>{console.warn(e);toast(t('e_gen'))});break}
  }
},true);

}

const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function b64u(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
const subId=sub=>btoa(sub.endpoint).replace(/[^A-Za-z0-9]/g,'').slice(-60);
async function ntCheck(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){nt.state=isIOS()&&!isStandalone()?'install':'unsup';return}
    if(Notification.permission==='denied'){nt.state='denied';return}
    const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
    nt.state=sub&&Notification.permission==='granted'?'on':'off';
    if(sub&&fb.user)userRef().collection('push').doc(subId(sub)).set({sub:JSON.parse(JSON.stringify(sub)),tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Costa_Rica',lang,updatedAt:Date.now()},{merge:true}).catch(()=>{});
  }catch(e){nt.state='unsup'}
}
function notifCard(compact){
  if(!fb.user||nt.state==='checking')return'';
  if(compact&&nt.state==='on')return'';
  const prem=isPremium();
  let body,act='';
  if(nt.state==='on'){body=`<span class="ntok">● ${t('nt_active')}</span>`;act=`<button class="btn sm ghost" data-act="nt-off">${t('nt_off')}</button>`}
  else if(nt.state==='install'){body=`<span class="muted" style="font-size:13px">${t('nt_install')}</span>`;act=`<button class="btn sm ghost" data-act="install">${t('nt_howInstall')}</button>`}
  else if(nt.state==='denied'){body=`<span class="muted" style="font-size:13px">${t('nt_denied')}</span>`}
  else if(nt.state==='unsup'){body=`<span class="muted" style="font-size:13px">${t('nt_unsup')}</span>`}
  else {body=`<span class="muted" style="font-size:13px">${t('nt_d')}</span>`;act=prem?`<button class="btn sm dark" data-act="nt-on">${t('nt_on')}</button>`:`<button class="btn sm dark" data-act="premium" data-why="prem_nt">${t('nt_on')}${PBADGE()}</button>`}

}
async function ntOn(btn){
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){nt.state=perm==='denied'?'denied':'off';render();refreshSheet();return}
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    await userRef().collection('push').doc(subId(sub)).set({sub:JSON.parse(JSON.stringify(sub)),tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Costa_Rica',lang,createdAt:Date.now()});
    nt.state='on';toast(t('nt_onOk'));
    try{reg.showNotification('PETFILE',{body:t('nt_test'),icon:'icon-192.png',badge:'icon-192.png',tag:'petfile-test'})}catch(e){}
  }catch(e){console.warn(e);toast(t('nt_err'))}
  render();refreshSheet();
}
async function ntOff(){
  try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await userRef().collection('push').doc(subId(sub)).delete().catch(()=>{});await sub.unsubscribe()}nt.state='off';toast(t('nt_offOk'))}catch(e){console.warn(e)}

/* recordatorios */
function reminders(pets){
  const out=[];
  pets.forEach(p=>(p.entries||[]).forEach(e=>{
    if(e.done)return;let when=null,label='';
    if((e.type==='vacuna'||e.type==='desp')&&e.next){when=e.next;label=(e.type==='vacuna'?t('r_boost'):t('r_desp'))+e.title}
    else if(e.type==='cita'&&e.date){when=e.date;label=e.title}
    else if(e.type==='med'&&e.end){const n=dayDiff(e.end);if(n>=0&&n<=3){when=e.end;label=t('r_end')+e.title}}
    if(!when)return;const n=dayDiff(when);if(n<-60)return;out.push({pet:p,entry:e,when,label,n});
  }));
  return out.sort((a,b)=>a.when.localeCompare(b.when));
}

/* imágenes */
function resizeImage(file,max,square,asBlob){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,sx=0,sy=0,sw=w,sh=h;
  if(square){const s=Math.min(w,h);sx=(w-s)/2;sy=(h-s)/2;sw=sh=s;w=h=Math.min(max,s)}else{const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,w,h);URL.revokeObjectURL(url);
  if(asBlob)c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.85);else res(c.toDataURL('image/jpeg',.8))};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url})}

  try{
    const blob=await resizeImage(file,1600,false,true);
    const prompt=`This image is a veterinary prescription (it may be handwritten, in any language) for a pet named "${p.name}" (${p.species||'pet'}). Today is ${todayStr()}.
Extract every prescribed medication. Reply ONLY with JSON in this shape:
{"legible":true|false,"veterinario":"vet or clinic name if shown, else empty","fecha":"YYYY-MM-DD if shown, else empty","medicamentos":[{"nombre":"name and strength","dosis":"amount per dose","frecuencia":"e.g. every 12 hours","duracion_dias":number or null,"indicaciones":"other short instructions"}]}
Write the text values in ${t('rx_lang')}. If something is not clearly legible, leave it empty instead of guessing. If the image is not a prescription, "legible":false and an empty list.`;
    const r=await state.caps.sample.json(prompt,{images:[blob],cache:false});

/* calendario */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function icsEvent(p,e,when,label){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');const L=['BEGIN:VEVENT','UID:'+e.id+'-'+when.replace(/\D/g,'')+'@petfile','DTSTAMP:'+stamp];
  if(when.includes('T')){const d=new Date(when);const f=x=>ymd(x).replace(/-/g,'')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00';L.push('DTSTART:'+f(d),'DTEND:'+f(new Date(d.getTime()+36e5)))}
  else L.push('DTSTART;VALUE=DATE:'+when.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(when,1).replace(/-/g,''));
  L.push('SUMMARY:'+icsEsc(p.name+' — '+label));const desc=[e.vet,e.notes].filter(Boolean).join('\n');if(desc)L.push('DESCRIPTION:'+icsEsc(desc));if(e.vet)L.push('LOCATION:'+icsEsc(e.vet));
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(label),'TRIGGER:-P1D','END:VALARM','END:VEVENT');return L.join('\r\n');
}
async function downloadIcs(items,name){
  const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PETFILE//'+lang.toUpperCase(),'CALSCALE:GREGORIAN'].concat(items.map(r=>icsEvent(r.pet,r.entry,r.when,r.label))).concat(['END:VCALENDAR']).join('\r\n');
  try{await state.caps.downloads.save({filename:name,data:new Blob([body],{type:'text/calendar'})});toast(t('t_ics'))}catch(e){if(!(e&&e.code==='declined'))toast(t('t_icsErr'))}
}

    case'new-entry':closeSheet();entryForm(p,el.dataset.type);break;
    case'pick-rx':closeSheet();{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{if(inp.files[0])readRx(p,inp.files[0])};inp.click()}break;
    case'edit-entry':{const e=(p.entries||[]).find(x=>x.id===el.dataset.e);if(e)entryForm(p,e.type,e);break}
    case'ask-del':state.confirmEntry=el.dataset.e;render();break;
    case'cancel-del':state.confirmEntry=null;render();break;
    case'del-entry':state.confirmEntry=null;persist(Object.assign({},p,{entries:(p.entries||[]).filter(x=>x.id!==el.dataset.e)}));toast(t('t_entryDel'));break;
    case'filter':state.filter=el.dataset.f;state.confirmEntry=null;render();break;
    case'done':persist(Object.assign({},p,{entries:(p.entries||[]).map(x=>x.id===el.dataset.e?Object.assign({},x,{done:true}):x)}));toast(t('t_done'));break;
    case'ics':{const r=reminders([p]).find(x=>x.entry.id===el.dataset.e);if(r)downloadIcs([r],(p.name+'-'+r.entry.title).replace(/[^\wáéíóúñ-]+/gi,'-').slice(0,50)+'.ics');break}
    case'ics-all':{const r=reminders(petsSorted()).filter(x=>x.n>=0);if(r.length)downloadIcs(r,'petfile.ics');break}
    case'save-rx':saveRx(p);break;
  }
});
document.addEventListener('change',ev=>{if(ev.target.id==='rxfile'){const f=ev.target.files[0];const p=state.pets[state.view.id];if(f&&p)readRx(p,f);ev.target.value=''}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#layer').innerHTML)closeSheet()});
fromHash();connect();
})();
</script>

</body>
